services:
  archive-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: rosie-rebirth-archive-chat:local
    container_name: rosie-rebirth-archive-chat
    restart: unless-stopped
    network_mode: host
    environment:
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:?Set LOCAL_LLM_API_KEY in your shell or .env}
      ARCHIVE_CHAT_EMBEDDING_API_KEY: ${ARCHIVE_CHAT_EMBEDDING_API_KEY:?Set ARCHIVE_CHAT_EMBEDDING_API_KEY in your shell or .env}
      ARCHIVE_CHAT_LLM_ENDPOINT: ${ARCHIVE_CHAT_LLM_ENDPOINT:-http://127.0.0.1:8000/v1}
      ARCHIVE_CHAT_LLM_MODEL: ${ARCHIVE_CHAT_LLM_MODEL:-Ornith-1.5-35B}
      ARCHIVE_CHAT_EMBEDDING_ENDPOINT: ${ARCHIVE_CHAT_EMBEDDING_ENDPOINT:-http://127.0.0.1:8001/v1}
      ARCHIVE_CHAT_EMBEDDING_MODEL: ${ARCHIVE_CHAT_EMBEDDING_MODEL:-BAAI/bge-m3}
    command:
      - sh
      - -ec
      - >-
        exec python -m scripts.archive_chat --host 0.0.0.0 --port 8765 --llm
        --retrieval vector --archive /archive --soul /archive/identity/source/SOUL.md
    volumes:
      - type: bind
        source: ${ARCHIVE_PATH:?Set ARCHIVE_PATH to the absolute archive directory}
        target: /archive
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8765/healthz', timeout=3).status == 200"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
